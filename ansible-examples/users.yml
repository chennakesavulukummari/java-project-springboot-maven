---
- name: Manage users
  hosts: localhost
  become: yes

  vars:
    users:
      - name: deploy
        groups: sudo
        shell: /bin/bash
      - name: appuser
        groups: www-data
        shell: /bin/bash

  tasks:
    - name: Create users
      user:
        name: "{{ item.name }}"
        groups: "{{ item.groups }}"
        shell: "{{ item.shell }}"
        state: present
      loop: "{{ users }}"

    - name: Add SSH keys
      authorized_key:
        user: "{{ item.name }}"
        key: "{{ lookup('file', 'keys/' + item.name + '.pub') }}"
      loop: "{{ users }}"

...