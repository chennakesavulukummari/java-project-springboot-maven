---
- name: Deploy application config
  hosts: localhost
  become: true

  vars:
    app_name: myapp
    app_port: 8080
    db_host: db.example.com
    db_name: production

  tasks:
    - name: Create app directory
      file:
        path: "/opt/{{ app_name }}"
        state: directory
        mode: '0755'

    - name: Deploy config from template
      template:
        src: templates/app.conf.j2
        dest: "/opt/{{ app_name }}/config.yml"