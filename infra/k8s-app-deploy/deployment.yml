apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbinary-deployment
spec:
  selector:
    matchLabels:
      app: cloudbinary
  replicas: 2 # tells deployment to run 2 pods matching the template
  template:
    metadata:
      labels:
        app: cloudbinary
    spec:
      containers:
      - name: cloudbinary
        image: kesavkummari/cbinsite:20250422
        ports:
        - containerPort: 80


